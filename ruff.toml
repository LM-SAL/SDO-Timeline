target-version = "py314"
line-length = 120
preview = true
extend-exclude = [
    "__pycache__",
    "build",
]

[lint]
select = [
    "ALL",
]
ignore = [
    "missing-copyright-notice",        # The license is in LICENSE, not in each file
    "missing-trailing-comma",          # Conflicts with the formatter
    "unnecessary-multiline-docstring", # docformatter puts the summary on its own line
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"test_*.py" = [
    "assert",                 # Tests use assert
    "import-private-name",    # Tests check the private helpers
    "magic-value-comparison", # Comparing against values is the point of a test
]

[lint.pydocstyle]
convention = "numpy"

[format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
